services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
  app:
    build: .
    restart: unless-stopped
    depends_on: [mongo]
    environment:
      MONGO_URL: mongodb://mongo:27017/gemis
      TZ: Europe/Istanbul
    ports:
      - "3000:3000"
    volumes:
      - uploads:/data/uploads
volumes:
  mongo-data:
  uploads:
