services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
  app:
    build: .
    restart: unless-stopped
    depends_on: [mongo]
    environment:
      MONGO_URL: mongodb://mongo:27017/gemis
      TZ: Europe/Istanbul
      # Google Drive hizmet hesabı anahtarı (JSON içeriği, tek satır). Boşsa Drive özelliği kapalı kalır.
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
    ports:
      - "1138:1138"
    volumes:
      - uploads:/data/uploads
volumes:
  mongo-data:
  uploads:
