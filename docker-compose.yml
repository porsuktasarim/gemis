services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
  # El yazısı OCR (PaddleOCR, yerel, internetsiz). İstenmezse bu servis silinebilir; uygulama Tesseract'a döner.
  ocr-el:
    build: ./ocr-el
    restart: unless-stopped
  app:
    build: .
    restart: unless-stopped
    depends_on: [mongo]
    environment:
      MONGO_URL: mongodb://mongo:27017/gemis
      TZ: Europe/Istanbul
      OCR_EL_URL: http://ocr-el:8000
      # Google Drive hizmet hesabı anahtarı (JSON içeriği, tek satır). Boşsa Drive özelliği kapalı kalır.
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
    ports:
      - "1138:1138"
    volumes:
      - uploads:/data/uploads
volumes:
  mongo-data:
  uploads:
